name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # fusion-operation 是业务层: douyin_tools 依赖 agent-studio 的 tools/registry+base
      # (BaseTool 契约) + fusion-core (config 单点解析, issue #22) + fusion-harness.
      # 单仓 CI 无 monorepo 共享 venv, 需浅克隆安装.
      - name: Checkout monorepo deps (fusion-core + fusion-harness + fusion-agent-studio)
        run: |
          git clone --depth 1 https://github.com/dahai80/fusion-core.git /tmp/fusion-core
          git clone --depth 1 https://github.com/dahai80/fusion-harness.git /tmp/fusion-harness
          git clone --depth 1 https://github.com/dahai80/fusion-agent-studio.git /tmp/fusion-agent-studio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock httpx pyyaml keyring numpy Pillow opencv-python-headless
          pip install -e /tmp/fusion-core --no-deps
          pip install -e /tmp/fusion-harness --no-deps
          pip install -e /tmp/fusion-agent-studio

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Deploy check (no personal paths + paths writable + queue.db)
        run: |
          python scripts/deploy_check.py
