[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-operation"
version = "0.1.2"
description = "Fusion 抖音吸粉运营：基于 fusion-agent-studio DAG + fusion-mlx 的可编排自动化"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "playwright",
    "opencv-python-headless>=4.10.0",
    "Pillow",
    "numpy",
    "edge-tts",
    "fusion-core",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[tool.setuptools.packages.find]
include = ["douyin_tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
