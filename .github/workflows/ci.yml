name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock httpx pyyaml
          pip install keyring || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Deploy check (no personal paths + paths writable + queue.db)
        run: |
          python scripts/deploy_check.py
