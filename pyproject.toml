[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-operation"
version = "0.1.6"
description = "Fusion 抖音吸粉运营：基于 fusion-agent-studio DAG + fusion-mlx 的可编排自动化"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "playwright",
    "opencv-python-headless>=4.10.0",
    "Pillow",
    "numpy",
    "edge-tts",
    "fastapi",
    "uvicorn",
    "fusion-core",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[project.scripts]
douyin-ops = "run_graph:main"
douyin-ops-api = "web_api:main"

[tool.setuptools]
py-modules = ["run_graph", "web_api"]

[tool.setuptools.packages.find]
include = ["douyin_tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
